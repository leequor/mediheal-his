<!doctype html>
<html lang='en'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Appointments · MediHeal</title>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=Outfit:wght@700&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/css/tokens.css'><link rel='stylesheet' href='assets/css/base.css'><link rel='stylesheet' href='assets/css/components.css'><link rel='stylesheet' href='assets/css/pages.css'>
</head><body data-page='appointments'>
<!-- Figma: Appointments 23:2289 (frame origin 4800,34000). Appointment Form 248:821 and Appointment confirmed 304:502 are still to convert; the modal is temporary. -->
<div class='stage'>
  <div id='kpis'></div>
  <h1 class='a-title'>Appointments</h1>
  <div class='a-controls'>
    <div class='a-search'><span id='sicon'></span><input id='q' type='search' placeholder='Search patients, doctors...' aria-label='Search appointments'></div>
    <div class='a-dd' id='dd-stat' style='width:114px'></div>
    <div class='a-dd' id='dd-doc' style='width:147px'></div>
    <button class='a-new' id='new'><span id='picon'></span>New Appointment / Walk-In</button>
  </div>
  <section class='a-table'>
    <div class='a-grid a-th'><span>PATIENT NAME</span><span>DATE &amp; TIME</span><span>APPOINTMENT TYPE</span><span>DOCTOR</span><span>STATUS</span><span>ACTIONS</span></div>
    <div id='rows'></div>
    <div class='a-foot'><span id='count'></span>
      <div class='a-pages'><button disabled aria-label='Previous page'>\u2039</button><button class='on'>1</button><button disabled title='Demo data fits on one page'>2</button><button disabled>3</button><button disabled aria-label='Next page'>\u203a</button></div>
    </div>
  </section>
</div>
<script src='assets/js/data.js'></script><script src='assets/js/data-records.js'></script><script src='assets/js/icons.js'></script><script src='assets/js/ui.js'></script><script src='assets/js/shell.js'></script>
<script>
const $ = id => document.getElementById(id);
const T = HIS.apptTotals;
$('sicon').innerHTML = svg('search', 16);
$('picon').innerHTML = svg('plus', 16);
// [label, value, icon, icon bg, icon color, width, height, left]
const K = [
  ['Total Appointments', T.total, 'calendar-check', '#dbeafe', '#2563eb', 224, 126, 148],
  ['Confirmed', T.confirmed, 'check-circle', '#d1fae5', '#10b981', 197, 126, 392],
  ['Pending Approval', T.pending, 'clock', '#fef3c7', '#f59e0b', 232, 126, 609],
  ['Cancelled', T.cancelled, 'x-circle', '#fee2e2', '#ef4444', 194, 136, 861],
  ['Walk-In', T.walkin, 'person-circle', '#1e293b', '#ffffff', 183, 136, 1075]
];
$('kpis').innerHTML = K.map(k => "<div class='akpi' style='left:" + k[7] + 'px;width:' + k[5] + 'px;height:' + k[6] + "px'><div class='at'><span>" + k[0] + "</span><i style='background:" + k[3] + ';color:' + k[4] + "'>" + svg(k[2], 20) + "</i></div><div class='aval'>" + k[1] + '</div></div>').join('');

const state = { q: '', stat: 'Status: All', doc: 'Doctor: All Drs.' };
makeDropdown($('dd-stat'), { options: ['Status: All', ...HIS.apptStatuses], onChange: v => { state.stat = v; render(); } });
makeDropdown($('dd-doc'), { options: ['Doctor: All Drs.', ...HIS.doctors], onChange: v => { state.doc = v; render(); } });
document.querySelectorAll('.a-dd').forEach(d => d.classList.add('light'));

function render() {
  const q = state.q.trim().toLowerCase();
  const list = HIS.appointments.map((a, i) => Object.assign({}, a, { i })).filter(a =>
    (state.stat === 'Status: All' || a.status === state.stat) &&
    (state.doc === 'Doctor: All Drs.' || a.doctor === state.doc) &&
    (!q || (a.patient + ' ' + a.doctor + ' ' + a.kind).toLowerCase().includes(q)));
  $('rows').innerHTML = list.length ? list.map(a =>
    "<div class='a-grid a-row'><span class='nm'>" + a.patient + '</span><span>' + a.when + "</span><span class='ty'>" + a.kind + '</span><span>' + a.doctor + '</span>' +
    "<span><span class='a-pill " + a.status + "'>" + a.status + '</span></span>' +
    "<span class='a-act'><button class='a-ib' data-edit='" + a.i + "' aria-label='Edit appointment for " + a.patient + "'>" + svg('edit', 16) + "</button><button class='a-ib' data-more='" + a.i + "' aria-label='More actions'>" + svg('more', 16) + '</button></span></div>').join('')
    : "<div class='empty'>No appointments match these filters.</div>";
  $('count').textContent = 'Showing ' + (list.length ? '1-' + list.length : '0') + ' of ' + T.total + ' appointments';
}

function toInputs(when) {
  const parts = when.split(' \u2022 ');
  const dt = new Date(parts[0] + ' ' + parts[1]);
  const p = n => String(n).padStart(2, '0');
  return { date: dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()), time: p(dt.getHours()) + ':' + p(dt.getMinutes()) };
}
function form(a) {
  a = a || {};
  openModal({
    title: a.patient ? 'Edit Appointment' : 'New Appointment / Walk-In', sub: 'Temporary form. The real Appointment Form screen comes from Figma next.',
    saveLabel: a.patient ? 'Save changes' : 'Create',
    body: "<label>Patient</label><input name='patient' required value='" + (a.patient || '') + "'>" +
      "<div class='row'><div><label>Date</label><input name='date' type='date' required value='" + (a.date || '2026-08-31') + "'></div><div><label>Time</label><input name='time' type='time' required value='" + (a.time || '09:00') + "'></div></div>" +
      "<label>Type</label><select name='kind'>" + opts(HIS.apptKinds, a.kind) + '</select>' +
      "<div class='row'><div><label>Doctor</label><select name='doctor'>" + opts(HIS.doctors, a.doctor) + "</select></div><div><label>Status</label><select name='status'>" + opts(HIS.apptStatuses, a.status || 'Pending') + '</select></div></div>',
    onSave: d => {
      const dt = new Date(d.date + 'T' + d.time);
      const rec = { patient: d.patient, kind: d.kind, doctor: d.doctor, status: d.status, date: d.date, time: d.time,
        when: HIS.fmtShort(dt) + ' \u2022 ' + dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) };
      if (a.i != null) HIS.appointments[a.i] = rec; else HIS.appointments.push(rec);
      render();
    }
  });
}

$('q').oninput = e => { state.q = e.target.value; render(); };
$('new').onclick = () => form();
$('rows').onclick = e => {
  const ed = e.target.closest('[data-edit]');
  const mo = e.target.closest('[data-more]');
  document.querySelectorAll('.a-menu').forEach(m => m.remove());
  if (ed) { const i = +ed.dataset.edit; const a = HIS.appointments[i]; form(Object.assign({ i }, a, a.date ? {} : toInputs(a.when))); }
  if (mo) {
    e.stopPropagation();
    const i = +mo.dataset.more;
    const menu = document.createElement('div');
    menu.className = 'a-menu';
    menu.innerHTML = "<button data-s='Completed'>Mark completed</button><button data-s='Cancelled'>Cancel appointment</button>";
    menu.onclick = ev => { const b = ev.target.closest('button'); if (b) { HIS.appointments[i].status = b.dataset.s; render(); } };
    mo.closest('.a-act').appendChild(menu);
  }
};
document.addEventListener('click', () => document.querySelectorAll('.a-menu').forEach(m => m.remove()));
render();
</script>
</body></html>
