<!doctype html>
<html lang='en'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Registration · MediHeal</title>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=Outfit:wght@700&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/css/tokens.css'><link rel='stylesheet' href='assets/css/base.css'><link rel='stylesheet' href='assets/css/components.css'><link rel='stylesheet' href='assets/css/pages.css'>
</head><body data-page='registration'>
<!-- Figma: Registration 23:2285 (frame origin 3200,34000). Inpatient form 420:1147 and outpatient form 420:1434 are still to convert; the New Registration modal is temporary. -->
<div class='stage'>
  <div id='kpis'></div>
  <h1 class='page-h'>Patient Registration</h1>
  <p class='page-sub'>Registry of all inpatient and outpatient registrations across departments</p>
  <button class='btn-primary' id='new' style='left:489px;top:336px;width:165px'>+ New Registration</button>
  <section class='card-lg' style='left:50px;top:410px;width:1350px;min-height:638px;padding-top:136px;padding-bottom:24px;border-radius:10px'>
    <div class='tabs' id='tabs'></div>
    <div class='sbox'>
      <span id='sicon'></span><input id='q' type='search' placeholder='Search records...' aria-label='Search records'>
    </div>
    <div id='dd-dept' style='left:783px;top:26px;width:236px;height:45px'></div>
    <div id='dd-stat' style='left:1071px;top:26px;width:236px;height:45px'></div>
    <div class='rule'></div>
    <div class='thead'><span>PATIENT</span><span>TYPE</span><span>DEPARTMENT</span><span>DOCTOR</span><span>REGISTERED</span><span>STATUS</span><span>ACTION</span></div>
    <div id='rows'></div>
  </section>
</div>
<script src='assets/js/data.js'></script><script src='assets/js/data-records.js'></script><script src='assets/js/icons.js'></script><script src='assets/js/ui.js'></script><script src='assets/js/shell.js'></script>
<script>
const $ = id => document.getElementById(id);
const state = { tab: 'All', q: '', dept: 'All Departments', stat: 'All Statuses' };
$('sicon').innerHTML = svg('search', 16);
$('tabs').innerHTML = [['All', 0], ['Inpatient', 105], ['Outpatient', 210]].map(t => "<button data-t='" + t[0] + "' style='left:" + (50 + t[1]) + "px'>" + t[0] + '</button>').join('');
makeDropdown($('dd-dept'), { options: ['All Departments', ...HIS.departments], onChange: v => { state.dept = v; render(); } });
makeDropdown($('dd-stat'), { options: ['All Statuses', ...HIS.patientStatuses], onChange: v => { state.stat = v; render(); } });

function renderKpis() {
  const p = HIS.patients;
  const k = [
    ['Total Registered', p.length, 'All patients in the current registry', 'users'],
    ['Inpatients', p.filter(x => x.type === 'Inpatient').length, 'Currently admitted or under admission', 'bed'],
    ['Outpatients', p.filter(x => x.type === 'Outpatient').length, 'Clinic visits without admission', 'walk'],
    ['Needs Attention', p.filter(x => x.attention).length, 'Critical cases and patients waiting', 'clock']
  ];
  $('kpis').innerHTML = k.map((c, i) => "<div class='rstat' style='left:" + (77 + 337.7 * i).toFixed(1) + "px'><div class='lb'>" + c[0] + "</div><div class='ic'>" + svg(c[3], 18) + "</div><div class='vl'>" + c[1] + "</div><div class='ft'>" + c[2] + '</div></div>').join('');
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab));
  const q = state.q.trim().toLowerCase();
  const list = HIS.patients.filter(p =>
    (state.tab === 'All' || p.type === state.tab) &&
    (state.dept === 'All Departments' || p.dept === state.dept) &&
    (state.stat === 'All Statuses' || p.status === state.stat) &&
    (!q || (p.name + ' ' + p.id + ' ' + p.doctor + ' ' + p.dept).toLowerCase().includes(q)));
  $('rows').innerHTML = list.length ? list.map(p =>
    "<div class='rrow'><div class='pt'><span class='ini'>" + initialsOf(p.name) + '</span><div><b>' + p.name + '</b><small>' + p.id + ' \u00b7 ' + p.age + ' yrs</small></div></div>' +
    "<div><span class='badge " + HIS.statusClass[p.type] + "'>" + p.type + '</span></div>' +
    "<div class='tx'>" + p.dept + '</div><div class=\'dc\'>' + p.doctor + '</div><div class=\'tx\'>' + p.registered + '</div>' +
    "<div><span class='badge " + HIS.statusClass[p.status] + "'>" + p.status + '</span></div>' +
    "<div><button class='go-btn' aria-label='Open profile for " + p.name + "' title='Profile page coming next'>" + svg('arrow', 16) + '</button></div></div>').join('')
    : "<div class='empty'>No patients match these filters.</div>";
}
$('tabs').onclick = e => { if (e.target.dataset.t) { state.tab = e.target.dataset.t; render(); } };
$('q').oninput = e => { state.q = e.target.value; render(); };

$('new').onclick = () => openModal({
  title: 'New Registration', sub: 'Temporary form. The real inpatient/outpatient screens come from Figma next.', saveLabel: 'Register',
  body: "<label>Full name</label><input name='name' required>" +
    "<div class='row'><div><label>Age</label><input name='age' type='number' min='0' max='120' required></div><div><label>Type</label><select name='type'>" + opts(['Outpatient', 'Inpatient']) + '</select></div></div>' +
    "<div class='row'><div><label>Department</label><select name='dept'>" + opts(HIS.departments) + "</select></div><div><label>Doctor</label><select name='doctor'>" + opts(HIS.doctors) + '</select></div></div>',
  onSave: d => {
    const next = Math.max(...HIS.patients.map(p => +p.id.slice(3))) + 1;
    const now = new Date();
    HIS.patients.unshift({ name: d.name, id: 'PT-' + next, age: +d.age, type: d.type, dept: d.dept, doctor: d.doctor,
      registered: HIS.fmtShort(HIS.today) + ' \u00b7 ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      status: d.type === 'Inpatient' ? 'Admitted' : 'Waiting' });
    renderKpis(); render();
  }
});
renderKpis(); render();
</script>
</body></html>
